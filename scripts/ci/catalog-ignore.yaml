# The critical vulnerabilities with a fix that CI found in the catalog's pinned images,
# which only their upstream can fix, with the date by which each is looked at again
# (scripts/ci/scan-catalog.sh). Mediaplane never patches an app's image (spec §1.4):
# a fix arrives as Renovate's bump of the pin, once upstream ships it, and its entry
# goes then. An entry past its date no longer counts, so CI reports the finding again
# (or fails on it, with CATALOG_SCAN: fail in ci.yml) until the pin is bumped or the
# entry is renewed with a new date and the reason. Found on 2026-10-25.
#
# An entry counts only in the app its statement names: the text after the first " in "
# must name the app as the catalog does (scripts/ci/catalog-images.ts gives each image
# only the entries of its own app). An id is never ignored in another app's image.
