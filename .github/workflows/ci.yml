name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly too, so that a vulnerability found in an image, Node or a catalog app since
  # the last push still shows in a run that someone sees (a catalog app's image is
  # reported, not failed: see the catalog-images job).
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

concurrency:
  # One group per commit on main: a push to main neither cancels nor queues behind another
  # (a pending run in a shared group is cancelled by the next), so every commit there,
  # the release's too, gets its own full run and its own "All checks passed". One group per
  # ref elsewhere.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # A new push cancels the previous run on a branch, but never a run on main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Lint, type-check and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint checks the workflows, with shellcheck for their run steps; the same
      # image's shellcheck checks the shell scripts.
      - name: Lint the workflows and the shell scripts (actionlint, shellcheck)
        run: |
          image=rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          docker run --rm -v "$PWD:/repo:ro" -w /repo "$image" -color
          git ls-files -z -- '*.sh' | xargs -0 docker run --rm -v "$PWD:/repo:ro" -w /repo \
            --entrypoint shellcheck "$image" deploy/mediaplane .githooks/pre-commit
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm docs:check
      - run: pnpm test:coverage
      # The CLI's npm dependencies are bundled into one file in the image, where Trivy
      # can't see them, so they are audited here. This needs the npm registry.
      - name: Audit the CLI's production dependencies (fails on a critical advisory)
        run: pnpm audit --prod --audit-level critical
      # Node is a binary in the image's base, which neither Trivy nor pnpm audit sees. This
      # needs nodejs.org.
      - name: Does the image's Node have every security release of its line?
        run: pnpm exec tsx scripts/ci/node-security.ts

  # Decides whether the jobs that pull images (end-to-end, image, catalog images, the
  # Engine floor) are needed. The decision is made inside the workflow, rather than with
  # an `on:` path filter, so the workflow still runs on a docs-only push and `gate` (the
  # last job) still reports.
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        name: Did anything other than docs change?
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # No usable base (a new branch, or a force-push past fetched history): run it all.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base commit, so every job that pulls images runs."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          printf 'Changed files:\n%s\n' "$changed"
          if grep -q -v -E '(\.md$|^docs/|^LICENSE$|^$)' <<<"$changed"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs changed, so the jobs that pull images are skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: End-to-end (real Docker, ${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      # The apply test pulls about 7 GB of app images; make room for them. The arm64 image
      # has no Android SDK, GHC or CodeQL, so only what exists is deleted.
      - name: Free disk space
        run: |
          for path in /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL; do
            if [ -e "$path" ]; then
              sudo rm -rf "$path"
            else
              echo "not on this runner: $path"
            fi
          done
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # After the install, so the token isn't on the runner while dependencies install.
      - uses: ./.github/actions/docker-hub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: docker version && docker compose version
      # Every image the suite runs, pulled first with longer retries than apply's own, so
      # that a temporary registry error doesn't fail the job. apply pulls only what is
      # missing, so what it does and reports is unchanged.
      - name: Pull the images the tests run
        run: pnpm exec tsx scripts/ci/pull-images.ts "${{ matrix.arch }}"
      # The kill-switch test's WireGuard server needs the kernel module, and can't load it
      # from inside its container. The test fails, and never skips, without it.
      - name: Load the WireGuard kernel module
        run: sudo modprobe wireguard && test -d /sys/module/wireguard
      - run: pnpm test:e2e
      # If the job ran out of disk, this shows how much was left at the end.
      - name: Disk space at the end
        if: always()
        run: df -h /

  image:
    name: Image (${{ matrix.arch }}, as a release builds it, Trivy)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/docker-hub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      # Native on each runner: no emulation. This is the build the release workflow pushes,
      # with its SBOM and provenance, so every pull request proves it on both
      # architectures; it pushes nothing. The e2e tests build the same Dockerfile, whose
      # every input is pinned.
      - name: Build the image as a release does
        run: scripts/ci/build-image.sh "${{ matrix.arch }}" "$RUNNER_TEMP/image"
      - name: Scan it with Trivy (fails on critical vulnerabilities that have a fix)
        run: scripts/ci/scan-image.sh "${{ matrix.arch }}" "$RUNNER_TEMP/image/oci"
      - name: Disk space at the end
        if: always()
        run: df -h /

  # The apps' images, as the catalog pins them, from their registries: both architectures
  # from one runner. Only upstream can fix what Trivy finds there, so by the owner's
  # decision of 2026-10-27 a finding is reported (a warning, and the step summary), not
  # failed. A finding listed in scripts/ci/catalog-ignore.yaml is hidden until its date.
  # A scan that couldn't run fails the job in both modes.
  catalog-images:
    name: Catalog images (Trivy)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The switch: change report to fail to make a finding in a catalog image fail CI again.
      CATALOG_SCAN: report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # After the install, so the token isn't on the runner while dependencies install.
      - uses: ./.github/actions/docker-hub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Scan the amd64 images
        run: scripts/ci/scan-catalog.sh amd64
      - name: Scan the arm64 images
        if: ${{ !cancelled() }}
        run: scripts/ci/scan-catalog.sh arm64

  # The image's Docker CLI and Compose against Docker Engine 24, the oldest Mediaplane
  # supports. The other jobs run the runners' own Docker.
  engine-floor:
    name: Docker Engine 24 (the floor)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/docker-hub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: scripts/ci/engine-floor.sh

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --redact --verbose

  # Branch protection should require only this check. A matrix job that a job-level `if`
  # skips reports under its unexpanded name, so on a docs-only push the per-architecture
  # checks never exist and a required one would wait forever. This job always runs and
  # always reports. `always()`, not `!cancelled()`: a cancelled run must not pass.
  gate:
    # scripts/release/ci-passed.sh looks for a check run of exactly this name, and
    # release.yml publishes only a commit where it passed: renaming it needs both changed.
    name: All checks passed
    needs: [check, changes, e2e, image, catalog-images, engine-floor, secrets]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Did every job that had to run succeed?
        env:
          CHECK: ${{ needs.check.result }}
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          E2E: ${{ needs.e2e.result }}
          IMAGE: ${{ needs.image.result }}
          CATALOG: ${{ needs.catalog-images.result }}
          FLOOR: ${{ needs.engine-floor.result }}
          SECRETS: ${{ needs.secrets.result }}
        run: |
          printf '%-14s %s\n' check "$CHECK" changes "$CHANGES" e2e "$E2E" \
            image "$IMAGE" catalog-images "$CATALOG" engine-floor "$FLOOR" \
            secrets "$SECRETS"
          echo "code changed: ${CODE:-unknown}"
          status=0
          for result in "$CHECK" "$CHANGES" "$E2E" "$IMAGE" "$CATALOG" "$FLOOR" "$SECRETS"; do
            case "$result" in
              failure | cancelled) status=1 ;;
            esac
          done
          if [ "$status" -ne 0 ]; then
            echo "A job failed or was cancelled."
          fi
          # Skipped is a pass only when the docs-only check said to skip them.
          if [ "$CODE" = "true" ]; then
            for job in e2e:"$E2E" image:"$IMAGE" catalog-images:"$CATALOG" \
              engine-floor:"$FLOOR"; do
              if [ "${job#*:}" != "success" ]; then
                echo "${job%%:*} should have run, but its result is ${job#*:}."
                status=1
              fi
            done
          fi
          exit "$status"
