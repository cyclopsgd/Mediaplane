name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push cancels the previous run on a branch, but never the previous commit's full
  # run on main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Lint, type-check and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      # The CLI's npm dependencies are bundled into one file in the image, where Trivy
      # can't see them, so they are audited here. This needs the npm registry.
      - name: Audit the CLI's production dependencies (fails on a critical advisory)
        run: pnpm audit --prod --audit-level critical

  # Decides whether the end-to-end and image jobs, which pull images, are needed. The
  # decision is made inside the workflow, rather than with an `on:` path filter, so the
  # workflow still runs on a docs-only push and `gate` (the last job) still reports.
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        name: Did anything other than docs change?
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # No usable base (a new branch, or a force-push past fetched history): run it all.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base commit, so the end-to-end and image jobs run."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          printf 'Changed files:\n%s\n' "$changed"
          if grep -q -v -E '(\.md$|^docs/|^LICENSE$|^$)' <<<"$changed"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs changed, so the end-to-end and image jobs are skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: End-to-end (real Docker, ${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      # The apply test pulls about 7 GB of app images; make room for them. The arm64 image
      # has no Android SDK, GHC or CodeQL, so only what exists is deleted.
      - name: Free disk space
        run: |
          for path in /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL; do
            if [ -e "$path" ]; then
              sudo rm -rf "$path"
            else
              echo "not on this runner: $path"
            fi
          done
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker version && docker compose version
      - run: pnpm test:e2e
      # If the job ran out of disk, this shows how much was left at the end.
      - name: Disk space at the end
        if: always()
        run: df -h /

  image:
    name: Image (${{ matrix.arch }}, Trivy)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Native on each runner: no emulation. A multi-arch manifest comes with publishing (S8).
      # The image scanned here and the one the e2e tests build are two builds of the same
      # Dockerfile. They are the same image only because every input of the Dockerfile is
      # pinned; an unpinned layer would let them differ.
      - name: Build the image
        run: docker build --tag mediaplane:ci .
      # The tarball goes in its own folder, and only that folder is mounted, read-only.
      - name: Scan it with Trivy (fails on critical vulnerabilities that have a fix)
        run: |
          scan="$(mktemp -d -p "$RUNNER_TEMP")"
          docker save mediaplane:ci --output "$scan/mediaplane.tar"
          docker run --rm --volume "$scan:/scan:ro" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --input /scan/mediaplane.tar --scanners vuln --severity CRITICAL \
            --ignore-unfixed --exit-code 1 --no-progress
      - name: Disk space at the end
        if: always()
        run: df -h /

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --redact --verbose

  # Branch protection should require only this check. A matrix job that a job-level `if`
  # skips reports under its unexpanded name, so on a docs-only push the per-architecture
  # checks never exist and a required one would wait forever. This job always runs and
  # always reports. `always()`, not `!cancelled()`: a cancelled run must not pass.
  gate:
    name: All checks passed
    needs: [check, changes, e2e, image, secrets]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Did every job that had to run succeed?
        env:
          CHECK: ${{ needs.check.result }}
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          E2E: ${{ needs.e2e.result }}
          IMAGE: ${{ needs.image.result }}
          SECRETS: ${{ needs.secrets.result }}
        run: |
          printf '%-8s %s\n' check "$CHECK" changes "$CHANGES" e2e "$E2E" \
            image "$IMAGE" secrets "$SECRETS"
          echo "code changed: ${CODE:-unknown}"
          status=0
          for result in "$CHECK" "$CHANGES" "$E2E" "$IMAGE" "$SECRETS"; do
            case "$result" in
              failure | cancelled) status=1 ;;
            esac
          done
          if [ "$status" -ne 0 ]; then
            echo "A job failed or was cancelled."
          fi
          # Skipped is a pass only when the docs-only check said to skip them.
          if [ "$CODE" = "true" ]; then
            for job in e2e:"$E2E" image:"$IMAGE"; do
              if [ "${job#*:}" != "success" ]; then
                echo "${job%%:*} should have run, but its result is ${job#*:}."
                status=1
              fi
            done
          fi
          exit "$status"
